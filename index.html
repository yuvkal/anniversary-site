<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Anniversary Yuvraj ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('anniversary-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #fff; /* Make text white for visibility */
    }

    .container {
      background: none; /* No white box */
      padding: 40px;
      border-radius: 15px;
      box-shadow: none;
      max-width: 600px;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 2.5em;
      color: #ffccdd; /* Soft pink title */
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
    }

    p {
      font-size: 1.2em;
      margin-top: 10px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
    }

    .heart {
      font-size: 3em;
      color: red;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heart">❤️</div>
    <h1>Happy One Year to Us, Yuvraj! I love you the most, baby!!!!</h1>
    <p>I love you forever.</p>
    <p>– From your cutie 💖</p>
  </div>
</body>
</html>
